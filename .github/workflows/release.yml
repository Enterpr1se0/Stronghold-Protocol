name: Release image

# Pushing a `v*` tag builds the production image (Dockerfile, multi-stage, node:22-alpine) and pushes it to GitHub
# Container Registry as 1.2.3 / 1.2 / latest (+ sha-…), for linux/amd64 and linux/arm64.
# A manual run builds from any ref, tagged sha-… only (never `latest`).
#
# The tag is the release point: ci.yml gates the commit, so this workflow only builds and pushes.
#
# Art is NOT baked into the image by default: NOTICE.md keeps the game art out of the repository and out of
# distributed artifacts (© Hypergryph / Yostar, non-commercial). Run the image with
#   -v "$PWD/public/assets:/app/public/assets:ro"
# or set the repository variable DOCKER_FETCH_ASSETS=1 (Settings → Variables) — or pass the input below — to build
# with `FETCH_ASSETS=1` instead (downloads ~250 MB during the build and adds it to the image).
#
# First push creates a *private* GHCR package; make it public in the repo's Settings → Packages if needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      fetch_assets:
        description: 'Bake the game art into the image (third-party, non-commercial; ~250 MB download)'
        type: choice
        options: ['0', '1']
        default: '0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to ghcr.io with this job's GITHUB_TOKEN

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  # 1 = bake the art in. A manual run's input wins, then the repository variable, then off.
  FETCH_ASSETS: ${{ github.event.inputs.fetch_assets || vars.DOCKER_FETCH_ASSETS || '0' }}

jobs:
  image:
    name: build & push (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under QEMU: safe here because the dependency tree is pure JS (htm, pixi.js, pixi-spine,
      # preact, three, ws) — nothing to compile, so `npm ci` in the build stage needs no native toolchain.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # no `{{major}}`: on a 0.x project it would publish a floating `0` that every 0.* release overwrites
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=Stronghold Protocol: Alliance
            org.opencontainers.image.description=卫戍协议：盟约 · unofficial co-op fan remake (Node.js server + browser client)
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # No provenance/SBOM attestation manifest: buildx would push it under the same tag and GHCR lists it
          # as a bogus `unknown/unknown` platform next to the real amd64 / arm64 images.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FETCH_ASSETS=${{ env.FETCH_ASSETS }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      # Values reach the shell through `env:` (never `${{ }}` inside `run:`) so no ref-derived string can be
      # interpreted as shell syntax.
      - name: Summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
